<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abertura de Conta - Banco Digital</title>
    <style>
        /* ===== RESET E ESTILOS GLOBAIS ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* ===== CABEÇALHO ===== */
        .header {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background-color: #0b0b0b;
            border-bottom: 1px solid #1c1c1e;
            flex-shrink: 0;
            z-index: 10;
        }
        .close-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: #fff;
            font-size: 18px;
            transition: background 0.2s;
        }
        .close-btn:hover { background: rgba(255,255,255,0.2); }
        .header .title {
            flex: 1;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-right: 40px;
        }
        .bank-logo {
            font-weight: 800;
            font-size: 18px;
            color: #f2c94c;
        }

        /* ===== ÁREA DO CHAT ===== */
        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scrollbar-width: none;
        }
        .chat-container::-webkit-scrollbar { display: none; }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }
        .message.bot {
            background-color: #1c1c1e;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            color: #ffffff;
        }
        .message.user {
            background-color: #f2c94c;
            color: #000000;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }
        .message .bot-name {
            font-size: 12px;
            color: #8e8e93;
            margin-bottom: 4px;
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== ÁREA DE INPUT (DIGITAÇÃO) ===== */
        .input-area {
            padding: 16px 20px 24px;
            background-color: #0b0b0b;
            border-top: 1px solid #1c1c1e;
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1;
            background: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 30px;
            padding: 16px 20px;
            font-size: 16px;
            color: #fff;
            outline: none;
            transition: border 0.2s;
        }
        .input-area input:focus {
            border-color: #f2c94c;
        }
        .input-area input::placeholder {
            color: #636366;
        }
        .input-area button {
            width: 54px; height: 54px;
            border-radius: 50%;
            background-color: #f2c94c;
            border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: #000;
            font-size: 20px;
            transition: transform 0.1s, opacity 0.2s;
        }
        .input-area button:active { transform: scale(0.95); }
        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== BOTÕES DE OPÇÃO RÁPIDA (QUICK REPLY) ===== */
        .quick-replies {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            align-self: flex-start;
            max-width: 85%;
        }
        .quick-replies button {
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            color: #fff;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s;
        }
        .quick-replies button:hover {
            background: #3a3a3c;
        }

        /* ===== LOADING (DIGITANDO...) ===== */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: #1c1c1e;
            padding: 14px 18px;
            border-radius: 20px;
            border-bottom-left-radius: 4px;
            gap: 4px;
        }
        .typing-indicator.active { display: flex; }
        .typing-indicator span {
            width: 6px; height: 6px;
            background: #8e8e93;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* ===== ANIMAÇÃO DE SUCESSO ===== */
        .success-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            animation: fadeIn 0.5s ease;
            height: 100%;
        }
        .success-screen.active { display: flex; }
        .success-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        .success-screen h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #f2c94c;
        }
        .success-screen p {
            color: #8e8e93;
            font-size: 15px;
            margin-bottom: 24px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <div class="header">
        <button class="close-btn" id="closeBtn" aria-label="Fechar">✕</button>
        <div class="title"><span class="bank-logo">MeuBanco</span> Digital</div>
    </div>

    <!-- ÁREA DO CHAT -->
    <div class="chat-container" id="chatContainer">
        <!-- As mensagens serão injetadas aqui -->
        <div class="typing-indicator" id="typingIndicator">
            <span></span><span></span><span></span>
        </div>
    </div>

    <!-- ÁREA DE INPUT -->
    <div class="input-area" id="inputArea">
        <input type="text" id="chatInput" placeholder="Digite sua resposta..." autocomplete="off">
        <button id="sendBtn" disabled>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22 2L11 13" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>

    <script>
        // ============================================================
        // 1. ESTADO E ELEMENTOS DO DOM
        // ============================================================
        const state = {
            step: 0,
            tipoConta: '',
            cpf: '',
            nome: '',
            dataNasc: '',
            telefone: '',
            email: '',
            cep: '',
            rua: '',
            bairro: '',
            cidade: '',
            uf: '',
            numero: ''
        };

        const chatContainer = document.getElementById('chatContainer');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const inputArea = document.getElementById('inputArea');

        // ============================================================
        // 2. FUNÇÕES UTILITÁRIAS DO CHAT
        // ============================================================
        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTyping() {
            typingIndicator.classList.add('active');
            scrollToBottom();
        }

        function hideTyping() {
            typingIndicator.classList.remove('active');
        }

        function addBotMessage(text, delay = 600) {
            showTyping();
            return new Promise((resolve) => {
                setTimeout(() => {
                    hideTyping();
                    const msg = document.createElement('div');
                    msg.className = 'message bot';
                    msg.innerHTML = `<span class="bot-name">Assistente Virtual</span>${text}`;
                    chatContainer.insertBefore(msg, typingIndicator);
                    scrollToBottom();
                    resolve();
                }, delay);
            });
        }

        function addUserMessage(text) {
            const msg = document.createElement('div');
            msg.className = 'message user';
            msg.textContent = text;
            chatContainer.insertBefore(msg, typingIndicator);
            scrollToBottom();
        }

        function showQuickReplies(options) {
            const container = document.createElement('div');
            container.className = 'quick-replies';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.textContent = opt.label;
                btn.onclick = () => {
                    container.remove(); // Remove os botões após clicar
                    addUserMessage(opt.label);
                    opt.action();
                };
                container.appendChild(btn);
            });
            chatContainer.insertBefore(container, typingIndicator);
            scrollToBottom();
        }

        // ============================================================
        // 3. MÁSCARAS PARA O INPUT DO CHAT
        // ============================================================
        function applyMask(value, maskType) {
            let v = value.replace(/\D/g, '');
            if (maskType === 'cpf') {
                if (v.length > 11) v = v.slice(0, 11);
                v = v.replace(/(\d{3})(\d)/, '$1.$2');
                v = v.replace(/(\d{3})(\d)/, '$1.$2');
                v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            } else if (maskType === 'phone') {
                if (v.length > 11) v = v.slice(0, 11);
                if (v.length > 10) v = v.replace(/^(\d{2})(\d{5})(\d{4}).*/, '($1) $2-$3');
                else if (v.length > 6) v = v.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, '($1) $2-$3');
                else if (v.length > 2) v = v.replace(/^(\d{2})(\d{0,5})/, '($1) $2');
                else if (v.length > 0) v = v.replace(/^(\d*)/, '($1');
            } else if (maskType === 'cep') {
                if (v.length > 8) v = v.slice(0, 8);
                v = v.replace(/^(\d{5})(\d)/, '$1-$2');
            } else if (maskType === 'date') {
                if (v.length > 8) v = v.slice(0, 8);
                v = v.replace(/(\d{2})(\d)/, '$1/$2');
                v = v.replace(/(\d{2})(\d)/, '$1/$2');
            }
            return v;
        }

        // ============================================================
        // 4. VALIDAÇÕES E APIS
        // ============================================================
        function isValidCPF(cpf) {
            cpf = cpf.replace(/[^\d]+/g, '');
            if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
            let sum = 0, rest;
            for (let i = 1; i <= 9; i++) sum += parseInt(cpf.substring(i - 1, i)) * (11 - i);
            rest = (sum * 10) % 11;
            if ((rest === 10) || (rest === 11)) rest = 0;
            if (rest !== parseInt(cpf.substring(9, 10))) return false;
            sum = 0;
            for (let i = 1; i <= 10; i++) sum += parseInt(cpf.substring(i - 1, i)) * (12 - i);
            rest = (sum * 10) % 11;
            if ((rest === 10) || (rest === 11)) rest = 0;
            if (rest !== parseInt(cpf.substring(10, 11))) return false;
            return true;
        }

        async function fetchAddress(cep) {
            try {
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await response.json();
                if (data.erro) return null;
                return data;
            } catch (e) {
                return null;
            }
        }

        // Simula API Paga de KYC / Busca de Nome (BaaS)
        function simulateKYC(cpf) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    // Nomes aleatórios para simular o retorno da API
                    const nomes = ['João Carlos Silva', 'Maria Eduarda Santos', 'Lucas Oliveira', 'Ana Beatriz Costa', 'Pedro Henrique Souza'];
                    const randomName = nomes[Math.floor(Math.random() * nomes.length)];
                    resolve(randomName);
                }, 1500);
            });
        }

        // ============================================================
        // 5. FLUXO CONVERSACIONAL (MÁQUINA DE ESTADOS)
        // ============================================================
        
        // Inicia a conversa
        async function startConversation() {
            await addBotMessage('Olá! 😊 Seja bem-vindo ao <strong>MeuBanco</strong>.');
            await addBotMessage('A abertura da sua conta é rápida, segura e leva poucos minutos.');
            await addBotMessage('Primeiro, qual tipo de conta você deseja abrir?', 800);
            
            showQuickReplies([
                { label: 'Conta Pessoal (PF)', action: () => { state.tipoConta = 'PF'; state.step = 1; askCPF(); } },
                { label: 'Conta Empresarial (PJ)', action: () => { state.tipoConta = 'PJ'; state.step = 1; askCPF(); } }
            ]);
        }

        async function askCPF() {
            await addBotMessage('Perfeito. Para começar, digite o número do seu CPF:');
            enableInput('cpf');
        }

        async function handleCPF(cpf) {
            if (!isValidCPF(cpf)) {
                await addBotMessage('Ops, esse CPF parece inválido. Por favor, verifique e digite novamente:');
                return;
            }
            state.cpf = cpf;
            await addBotMessage('Validando seus dados em nosso sistema...');
            
            // Simula API paga de KYC
            const nomeEncontrado = await simulateKYC(cpf);
            state.nome = nomeEncontrado;
            
            await addBotMessage(`Encontrei o nome <strong>${nomeEncontrado}</strong> vinculado a este CPF. Está correto?`);
            showQuickReplies([
                { label: 'Sim, está correto', action: () => { state.step = 2; askBirthDate(); } },
                { label: 'Não, corrigir nome', action: () => { askCorrectName(); } }
            ]);
        }

        async function askCorrectName() {
            await addBotMessage('Sem problemas. Por favor, digite seu nome completo:');
            state.step = 2.1; // Sub-estado
        }

        async function askBirthDate() {
            await addBotMessage('Agora, digite sua data de nascimento (DD/MM/AAAA):');
            enableInput('date');
        }

        async function handleBirthDate(date) {
            if (date.length !== 10) {
                await addBotMessage('Data incompleta. Por favor, digite no formato DD/MM/AAAA:');
                return;
            }
            state.dataNasc = date;
            state.step = 3;
            await addBotMessage('Qual é o seu telefone celular com DDD?');
            enableInput('phone');
        }

        async function handlePhone(phone) {
            if (phone.replace(/\D/g, '').length < 10) {
                await addBotMessage('Telefone incompleto. Digite o DDD e o número:');
                return;
            }
            state.telefone = phone;
            state.step = 4;
            await addBotMessage('Para onde devemos enviar o contrato e notificações? Digite seu e-mail:');
            enableInput('text');
            chatInput.placeholder = 'seu@email.com';
        }

        async function handleEmail(email) {
            if (!email.includes('@') || !email.includes('.')) {
                await addBotMessage('E-mail inválido. Por favor, digite um e-mail válido:');
                return;
            }
            state.email = email;
            state.step = 5;
            await addBotMessage('Agora precisamos do seu endereço. Digite o seu CEP (somente números):');
            enableInput('cep');
        }

        async function handleCEP(cep) {
            await addBotMessage('Buscando endereço...');
            const address = await fetchAddress(cep.replace(/\D/g, ''));
            
            if (!address || address.erro) {
                await addBotMessage('CEP não encontrado. Por favor, verifique e digite novamente:');
                return;
            }

            state.cep = cep;
            state.rua = address.logradouro;
            state.bairro = address.bairro;
            state.cidade = address.localidade;
            state.uf = address.uf;

            await addBotMessage(`Endereço encontrado: <strong>${address.logradouro}</strong>, ${address.bairro}, ${address.localidade} - ${address.uf}.`);
            await addBotMessage('Agora, digite apenas o <strong>número</strong> da sua residência:');
            state.step = 6;
            enableInput('text');
            chatInput.placeholder = 'Ex: 123';
        }

        async function handleNumber(number) {
            if (!number.trim()) {
                await addBotMessage('Por favor, digite o número do endereço:');
                return;
            }
            state.numero = number;
            state.step = 7;
            
            await addBotMessage('Tudo certo com seus dados! Estou enviando para nossa análise final de crédito e segurança...');
            disableInput();
            
            // Simula tempo de análise de KYC
            setTimeout(() => {
                showSuccessScreen();
            }, 3000);
        }

        function showSuccessScreen() {
            chatContainer.style.display = 'none';
            inputArea.style.display = 'none';
            
            const successDiv = document.createElement('div');
            successDiv.className = 'success-screen active';
            successDiv.innerHTML = `
                <div class="success-icon">🎉</div>
                <h2>Conta criada!</h2>
                <p>Bem-vindo ao MeuBanco, ${state.nome}.<br>Sua conta foi aprovada e já está pronta para uso.</p>
                <button style="background:#f2c94c; color:#000; border:none; padding:16px 24px; border-radius:30px; font-size:16px; font-weight:bold; cursor:pointer;" onclick="location.reload()">Acessar Conta</button>
            `;
            document.body.appendChild(successDiv);
        }

        // ============================================================
        // 6. CONTROLE DE INPUT E EVENTOS
        // ============================================================
        let currentMask = 'text';

        function enableInput(maskType) {
            chatInput.disabled = false;
            sendBtn.disabled = false;
            currentMask = maskType;
            chatInput.value = '';
            if (maskType === 'text') chatInput.placeholder = 'Digite sua resposta...';
            if (maskType === 'cpf') chatInput.placeholder = '000.000.000-00';
            if (maskType === 'phone') chatInput.placeholder = '(11) 99999-9999';
            if (maskType === 'cep') chatInput.placeholder = '00000-000';
            if (maskType === 'date') chatInput.placeholder = 'DD/MM/AAAA';
            chatInput.focus();
        }

        function disableInput() {
            chatInput.disabled = true;
            sendBtn.disabled = true;
            chatInput.placeholder = 'Aguarde...';
        }

        chatInput.addEventListener('input', (e) => {
            if (currentMask !== 'text') {
                e.target.value = applyMask(e.target.value, currentMask);
            }
        });

        function processUserInput() {
            const value = chatInput.value.trim();
            if (!value) return;

            addUserMessage(value);
            chatInput.value = '';
            disableInput();

            // Roteamento baseado no passo atual (State Machine)
            switch (state.step) {
                case 1: handleCPF(value); break;
                case 2.1: state.nome = value; state.step = 2; askBirthDate(); break;
                case 2: handleBirthDate(value); break;
                case 3: handlePhone(value); break;
                case 4: handleEmail(value); break;
                case 5: handleCEP(value); break;
                case 6: handleNumber(value); break;
            }
        }

        sendBtn.addEventListener('click', processUserInput);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') processUserInput();
        });

        document.getElementById('closeBtn').addEventListener('click', () => {
            if (confirm('Deseja cancelar a abertura de conta?')) {
                location.reload();
            }
        });

        // ============================================================
        // 7. INICIALIZAÇÃO
        // ============================================================
        window.onload = () => {
            disableInput();
            startConversation();
        };

    </script>
</body>
</html>
