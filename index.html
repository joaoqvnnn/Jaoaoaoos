<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abertura de Conta - MeuBanco</title>
    <style>
        /* ===== RESET E VARIÁVEIS ===== */
        :root {
            --bg-color: #0b0b0b;
            --surface: #1c1c1e;
            --surface-light: #2c2c2e;
            --primary: #f2c94c;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --danger: #ff453a;
            --success: #34c759;
            --border-radius: 18px;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex; align-items: center; padding: 16px 20px;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--surface);
            flex-shrink: 0; z-index: 10;
        }
        .close-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,255,255,0.08); border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #fff; font-size: 18px;
        }
        .header .title { flex: 1; text-align: center; font-size: 16px; font-weight: 600; }
        .bank-logo { font-weight: 800; color: var(--primary); }

        /* ===== ÁREA DO CHAT ===== */
        .chat-container {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 12px;
            scrollbar-width: none;
        }
        .chat-container::-webkit-scrollbar { display: none; }

        .message {
            max-width: 85%; padding: 14px 18px;
            border-radius: var(--border-radius); font-size: 15px;
            line-height: 1.4; animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }
        .message.bot {
            background-color: var(--surface); align-self: flex-start;
            border-bottom-left-radius: 4px; color: var(--text-main);
        }
        .message.user {
            background-color: var(--primary); color: #000;
            align-self: flex-end; border-bottom-right-radius: 4px;
            font-weight: 500;
        }
        .message .bot-name {
            font-size: 12px; color: var(--text-muted);
            margin-bottom: 4px; display: block;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ===== BOTÕES DE OPÇÃO RÁPIDA (QUICK REPLY) ===== */
        .quick-replies {
            display: flex; flex-direction: column; gap: 8px;
            margin-top: 4px; align-self: flex-start; max-width: 85%;
            animation: fadeIn 0.3s ease;
        }
        .quick-replies button {
            background: var(--surface-light); border: 1px solid #3a3a3c;
            color: #fff; padding: 12px 16px; border-radius: var(--border-radius);
            font-size: 14px; text-align: left; cursor: pointer;
            transition: background 0.2s, border 0.2s;
        }
        .quick-replies button:hover { background: #3a3a3c; border-color: var(--primary); }

        /* ===== COMPONENTES ESPECIAIS NO CHAT ===== */
        /* Seleção de País */
        .chat-select {
            background: var(--surface-light); color: #fff; border: 1px solid #3a3a3c;
            padding: 12px 16px; border-radius: var(--border-radius); font-size: 15px;
            width: 100%; margin-top: 8px; outline: none; cursor: pointer;
        }
        
        /* Upload de Documento */
        .upload-widget {
            background: var(--surface); border: 1px dashed var(--text-muted);
            border-radius: var(--border-radius); padding: 20px; text-align: center;
            margin-top: 8px; cursor: pointer; transition: border 0.2s;
        }
        .upload-widget:hover { border-color: var(--primary); }
        .doc-preview-box {
            display: none; margin-top: 8px; text-align: center;
        }
        .doc-preview-box.active { display: block; }
        .img-blur {
            width: 100%; height: 150px; border-radius: 12px;
            object-fit: cover; filter: blur(12px); transition: filter 0.3s ease;
            background: #333;
        }
        .doc-actions { display: flex; gap: 8px; margin-top: 12px; }
        .doc-actions button { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; }
        .btn-edit { background: var(--surface-light); color: #fff; }
        .btn-confirm { background: var(--primary); color: #000; }

        /* ===== ÁREA DE INPUT ===== */
        .input-area {
            padding: 16px 20px 24px; background-color: var(--bg-color);
            border-top: 1px solid var(--surface); display: flex; gap: 12px;
            flex-shrink: 0; align-items: center;
        }
        .input-area input {
            flex: 1; background: var(--surface); border: 1px solid var(--surface-light);
            border-radius: 30px; padding: 16px 20px; font-size: 16px; color: #fff;
            outline: none; transition: border 0.2s;
        }
        .input-area input:focus { border-color: var(--primary); }
        .input-area input::placeholder { color: #636366; }
        .input-area button {
            width: 54px; height: 54px; border-radius: 50%; background-color: var(--primary);
            border: none; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #000; font-size: 20px; transition: transform 0.1s, opacity 0.2s;
            flex-shrink: 0;
        }
        .input-area button:active { transform: scale(0.95); }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ===== TYPING INDICATOR ===== */
        .typing-indicator {
            display: none; align-self: flex-start; background: var(--surface);
            padding: 14px 18px; border-radius: var(--border-radius);
            border-bottom-left-radius: 4px; gap: 4px;
        }
        .typing-indicator.active { display: flex; }
        .typing-indicator span {
            width: 6px; height: 6px; background: var(--text-muted);
            border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* ===== SUCESSO ===== */
        .success-screen {
            display: none; flex-direction: column; align-items: center;
            justify-content: center; text-align: center; padding: 40px 20px;
            height: 100%; animation: fadeIn 0.5s ease;
        }
        .success-screen.active { display: flex; }
        .success-icon { font-size: 64px; margin-bottom: 16px; }
        .receipt-box {
            background: var(--surface); border-radius: 16px;
            padding: 20px; width: 100%; max-width: 350px;
            margin-bottom: 24px; text-align: left;
        }
        .receipt-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; }
        .receipt-row:last-child { margin-bottom: 0; }
        .receipt-row span:first-child { color: var(--text-muted); }
        .receipt-row span:last-child { font-weight: 600; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <button class="close-btn" onclick="if(confirm('Deseja cancelar a abertura de conta?')) location.reload()">✕</button>
        <div class="title"><span class="bank-logo">MeuBanco</span> Digital</div>
    </div>

    <!-- CHAT -->
    <div class="chat-container" id="chatContainer">
        <div class="typing-indicator" id="typingIndicator"><span></span><span></span><span></span></div>
    </div>

    <!-- INPUT -->
    <div class="input-area" id="inputArea">
        <input type="text" id="chatInput" placeholder="Digite sua resposta..." autocomplete="off" disabled>
        <button id="sendBtn" disabled onclick="processInput()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13" stroke="black" stroke-width="2" stroke-linecap="round"/><path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="black" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
    </div>

    <!-- TELA DE SUCESSO (Oculta no início) -->
    <div class="success-screen" id="successScreen">
        <div class="success-icon">🎉</div>
        <h2 style="margin-bottom: 8px;">Conta Aprovada!</h2>
        <p style="color: var(--text-muted); margin-bottom: 24px;">Bem-vindo ao MeuBanco. Sua conta já está ativa.</p>
        
        <div class="receipt-box">
            <div class="receipt-row"><span>Titular</span><span id="resNome">-</span></div>
            <div class="receipt-row"><span>Agência</span><span>0001</span></div>
            <div class="receipt-row"><span>Conta</span><span id="resConta">-</span></div>
            <div class="receipt-row"><span>Tipo</span><span id="resTipo">-</span></div>
            <div class="receipt-row"><span>Data de Abertura</span><span id="resData">-</span></div>
            <div class="receipt-row"><span>Status</span><span style="color: var(--success);">Ativa</span></div>
        </div>

        <button style="background:var(--primary); color:#000; border:none; padding:16px 32px; border-radius:30px; font-size:16px; font-weight:bold; cursor:pointer; width:100%; max-width:350px;" onclick="alert('Acessando menu principal...')">Acessar Menu Principal</button>
    </div>

    <script>
        // ============================================================
        // 1. ESTADO E VARIÁVEIS
        // ============================================================
        const state = {
            step: 0,
            tipoConta: '',
            pais: 'Brasil',
            docTipo: 'CPF',
            docValor: '',
            nomeReal: '',
            nomeMascarado: '',
            nomeCorrigido: '',
            dataNasc: '',
            nomeMae: '',
            email: '',
            telefone: '',
            profissao: '',
            empresa: '',
            renda: '',
            docFotoConfirmada: false,
            cep: '',
            rua: '',
            bairro: '',
            cidade: '',
            uf: '',
            numero: '',
            complemento: '',
            senha: '',
            pin: ''
        };

        const chatContainer = document.getElementById('chatContainer');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const inputArea = document.getElementById('inputArea');

        // 7 Países e seus respectivos documentos
        const countries = {
            'Brasil': { doc: 'CPF', mask: 'cpf', placeholder: '000.000.000-00' },
            'Estados Unidos': { doc: 'SSN', mask: 'text', placeholder: '000-00-0000' },
            'Portugal': { doc: 'NIF', mask: 'text', placeholder: '000000000' },
            'Espanha': { doc: 'NIF', mask: 'text', placeholder: '00000000X' },
            'Argentina': { doc: 'CUIT/CUIL', mask: 'text', placeholder: '00-00000000-0' },
            'México': { doc: 'RFC', mask: 'text', placeholder: 'XAXX010101000' },
            'Canadá': { doc: 'SIN', mask: 'text', placeholder: '000-000-000' }
        };

        // +100 Profissões
        const profissoes = [
            "Advogado", "Engenheiro Civil", "Médico", "Enfermeiro", "Professor", "Dentista", "Arquiteto", "Contador", 
            "Analista de Sistemas", "Desenvolvedor de Software", "Designer Gráfico", "Administrador", "Psicólogo", "Fisioterapeuta",
            "Nutricionista", "Farmacêutico", "Veterinário", "Jornalista", "Publicitário", "Relações Públicas", "Economista",
            "Piloto", "Comissário de Bordo", "Policial", "Bombeiro", "Militar", "Juiz", "Promotor", "Defensor Público",
            "Mecânico", "Eletricista", "Encanador", "Pedreiro", "Carpinteiro", "Pintor", "Motorista", "Entregador",
            "Vendedor", "Corretor de Imóveis", "Corretor de Seguros", "Gerente de Vendas", "Atendente", "Recepcionista",
            "Secretária", "Auxiliar Administrativo", "Auxiliar de Serviços Gerais", "Faxineiro", "Cozinheiro", "Garçom",
            "Barbeiro", "Cabeleireiro", "Esteticista", "Manicure", "Costureira", "Fotógrafo", "Cinegrafista", "Editor de Vídeo",
            "Ator", "Músico", "Dançarino", "Escritor", "Tradutor", "Bibliotecário", "Historiador", "Sociólogo", "Filósofo",
            "Biólogo", "Químico", "Físico", "Matemático", "Estatístico", "Geólogo", "Geógrafo", "Astrônomo", "Agrônomo",
            "Zootecnista", "Pecuarista", "Agricultor", "Pescador", "Minerador", "Gastrônomo", "Confeiteiro", "Padeiro",
            "Açougueiro", "Operador de Máquinas", "Soldador", "Torneiro Mecânico", "Técnico em Informática", "Técnico em Enfermagem",
            "Técnico em Segurança do Trabalho", "Despachante", "Bancário", "Analista Financeiro", "Auditor", "Atuário",
            "Personal Trainer", "Educador Físico", "Fonoaudiólogo", "Terapeuta Ocupacional", "Assistente Social", "Antropólogo",
            "Arqueólogo", "Paleontólogo", "Oceanógrafo", "Meteorologista", "Cientista de Dados", "UX/UI Designer",
            "Product Manager", "Scrum Master", "Analista de RH", "Recrutador", "Zelador", "Porteiro", "Segurança", "Vigilante",
            "Empresário", "Autônomo", "Freelancer", "Estudante", "Aposentado", "Do Lar", "Desempregado", "Outro"
        ];

        // ============================================================
        // 2. FUNÇÕES DO CHAT
        // ============================================================
        function scrollToBottom() { chatContainer.scrollTop = chatContainer.scrollHeight; }
        
        function showTyping() {
            typingIndicator.classList.add('active');
            scrollToBottom();
        }
        function hideTyping() { typingIndicator.classList.remove('active'); }

        function botSay(text, delay = 600) {
            return new Promise((resolve) => {
                showTyping();
                setTimeout(() => {
                    hideTyping();
                    const msg = document.createElement('div');
                    msg.className = 'message bot';
                    msg.innerHTML = `<span class="bot-name">Assistente Virtual</span>${text}`;
                    chatContainer.insertBefore(msg, typingIndicator);
                    scrollToBottom();
                    resolve();
                }, delay);
            });
        }

        function userSay(text) {
            const msg = document.createElement('div');
            msg.className = 'message user';
            msg.textContent = text;
            chatContainer.insertBefore(msg, typingIndicator);
            scrollToBottom();
        }

        function showQuickReplies(options) {
            const container = document.createElement('div');
            container.className = 'quick-replies';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.textContent = opt.label;
                btn.onclick = () => {
                    container.remove();
                    userSay(opt.label);
                    opt.action();
                };
                container.appendChild(btn);
            });
            chatContainer.insertBefore(container, typingIndicator);
            scrollToBottom();
        }

        function enableInput(maskType = 'text') {
            chatInput.disabled = false;
            sendBtn.disabled = false;
            chatInput.value = '';
            chatInput.focus();
            chatInput.dataset.mask = maskType;
            
            if (maskType === 'text') chatInput.placeholder = 'Digite sua resposta...';
            if (maskType === 'cpf') chatInput.placeholder = '000.000.000-00';
            if (maskType === 'phone') chatInput.placeholder = '(11) 99999-9999';
            if (maskType === 'cep') chatInput.placeholder = '00000-000';
            if (maskType === 'date') chatInput.placeholder = 'DD/MM/AAAA';
            if (maskType === 'password') chatInput.placeholder = 'Digite sua senha...';
            if (maskType === 'pin') chatInput.placeholder = '0000';
        }

        function disableInput() {
            chatInput.disabled = true;
            sendBtn.disabled = true;
            chatInput.placeholder = 'Aguarde...';
        }

        // ============================================================
        // 3. MÁSCARAS E VALIDAÇÕES
        // ============================================================
        chatInput.addEventListener('input', (e) => {
            const mask = chatInput.dataset.mask;
            let v = e.target.value;

            if (mask === 'cpf') {
                v = v.replace(/\D/g, '');
                if (v.length > 11) v = v.slice(0, 11);
                v = v.replace(/(\d{3})(\d)/, '$1.$2');
                v = v.replace(/(\d{3})(\d)/, '$1.$2');
                v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            } else if (mask === 'phone') {
                v = v.replace(/\D/g, '');
                if (v.length > 11) v = v.slice(0, 11);
                if (v.length > 10) v = v.replace(/^(\d{2})(\d{5})(\d{4}).*/, '($1) $2-$3');
                else if (v.length > 6) v = v.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, '($1) $2-$3');
                else if (v.length > 2) v = v.replace(/^(\d{2})(\d{0,5})/, '($1) $2');
                else if (v.length > 0) v = v.replace(/^(\d*)/, '($1');
            } else if (mask === 'cep') {
                v = v.replace(/\D/g, '');
                if (v.length > 8) v = v.slice(0, 8);
                v = v.replace(/^(\d{5})(\d)/, '$1-$2');
            } else if (mask === 'date') {
                v = v.replace(/\D/g, '');
                if (v.length > 8) v = v.slice(0, 8);
                v = v.replace(/(\d{2})(\d)/, '$1/$2');
                v = v.replace(/(\d{2})(\d)/, '$1/$2');
            } else if (mask === 'pin') {
                v = v.replace(/\D/g, '');
                if (v.length > 4) v = v.slice(0, 4);
            }
            e.target.value = v;
        });

        // Função para mascarar o nome (Ex: João da Silva -> J*** da S***)
        function maskName(fullName) {
            if (!fullName) return '';
            let parts = fullName.trim().split(/\s+/);
            if (parts.length === 1) return parts[0][0] + '***';
            
            // Mantém a primeira letra do primeiro nome e do último nome, mascara o resto
            let firstName = parts[0];
            let lastName = parts[parts.length - 1];
            let middleNames = parts.slice(1, parts.length - 1).map(() => '***').join(' ');
            
            let maskedFirst = firstName[0] + '***';
            let maskedLast = lastName[0] + '***';
            
            return `${maskedFirst} ${middleNames ? middleNames + ' ' : ''}${maskedLast}`.trim();
        }

        async function fetchAddress(cep) {
            try {
                const res = await fetch(`https://viacep.com.br/ws/${cep.replace(/\D/g,'')}/json/`);
                const data = await res.json();
                if (data.erro) return null;
                return data;
            } catch (e) { return null; }
        }

        // Simula a API Paga de KYC / Serpro
        function simulateKYC(doc) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    const nomes = ['João da Silva', 'Maria Eduarda Santos', 'Lucas Oliveira Costa', 'Ana Beatriz Souza', 'Pedro Henrique Almeida'];
                    const randomName = nomes[Math.floor(Math.random() * nomes.length)];
                    resolve(randomName);
                }, 1500);
            });
        }

        // ============================================================
        // 4. FLUXO DO CHAT (PASSO A PASSO)
        // ============================================================
        
        async function startChat() {
            await botSay('Olá! Seja bem-vindo ao <strong>MeuBanco Digital</strong>.');
            await botSay('A abertura da sua conta é rápida, segura e leva poucos minutos.');
            await botSay('Primeiro, qual tipo de conta você deseja abrir?');
            
            showQuickReplies([
                { label: 'Conta Pessoal (PF)', action: () => { state.tipoConta = 'Pessoa Física'; askCountry(); } },
                { label: 'Conta Empresarial (PJ)', action: () => { state.tipoConta = 'Pessoa Jurídica'; askCountry(); } }
            ]);
        }

        async function askCountry() {
            await botSay('Perfeito. Agora, selecione o seu país de nacionalidade:');
            
            // Cria um select customizado dentro do chat
            const container = document.createElement('div');
            container.className = 'quick-replies';
            
            const select = document.createElement('select');
            select.className = 'chat-select';
            Object.keys(countries).forEach(country => {
                const opt = document.createElement('option');
                opt.value = country;
                opt.textContent = country;
                select.appendChild(opt);
            });
            
            const btn = document.createElement('button');
            btn.textContent = 'Confirmar País';
            btn.style.background = 'var(--primary)';
            btn.style.color = '#000';
            btn.style.fontWeight = '600';
            btn.onclick = () => {
                state.pais = select.value;
                state.docTipo = countries[state.pais].doc;
                container.remove();
                userSay(`${state.pais} (${state.docTipo})`);
                askDocument();
            };
            
            container.appendChild(select);
            container.appendChild(btn);
            chatContainer.insertBefore(container, typingIndicator);
            scrollToBottom();
        }

        async function askDocument() {
            const docConfig = countries[state.pais];
            await botSay(`Para continuarmos, digite o seu <strong>${state.docTipo}</strong>:`);
            enableInput(docConfig.mask);
            state.step = 'doc';
        }

        async function handleDocument(doc) {
            if (doc.length < 5) {
                await botSay('Documento inválido. Por favor, digite novamente:');
                return;
            }
            state.docValor = doc;
            await botSay('Validando seus dados em nosso sistema...');
            
            // Simula KYC
            const nomeEncontrado = await simulateKYC(doc);
            state.nomeReal = nomeEncontrado;
            state.nomeMascarado = maskName(nomeEncontrado);
            
            await botSay(`Encontrei o titular <strong>${state.nomeMascarado}</strong> vinculado a este documento.`);
            await botSay('Essas informações estão corretas?');
            
            showQuickReplies([
                { label: 'Sim, está correto', action: () => { state.nomeCorrigido = state.nomeReal; askBirthDate(); } },
                { label: 'Não, corrigir nome', action: () => { askCorrectName(); } }
            ]);
        }

        async function askCorrectName() {
            await botSay('Sem problemas. Por favor, digite seu nome completo:');
            enableInput('text');
            state.step = 'nome_correcao';
        }

        async function askBirthDate() {
            await botSay('Agora, digite sua data de nascimento (DD/MM/AAAA):');
            enableInput('date');
            state.step = 'data_nasc';
        }

        async function askMotherName() {
            await botSay('Qual é o nome completo da sua mãe? (Necessário para validação de segurança)');
            enableInput('text');
            state.step = 'nome_mae';
        }

        async function askEmail() {
            await botSay('Qual é o seu e-mail?');
            enableInput('text');
            chatInput.placeholder = 'seu@email.com';
            state.step = 'email';
        }

        async function askPhone() {
            await botSay('Agora, digite o seu número de celular (com DDD):');
            enableInput('phone');
            state.step = 'telefone';
        }

        async function askProfession() {
            await botSay('Qual é a sua profissão? (Digite ou selecione na lista)');
            
            // Adiciona o datalist ao input
            const datalist = document.createElement('datalist');
            datalist.id = 'listaProfissoes';
            profissoes.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p;
                datalist.appendChild(opt);
            });
            document.body.appendChild(datalist);
            
            chatInput.setAttribute('list', 'listaProfissoes');
            enableInput('text');
            chatInput.placeholder = 'Digite sua profissão...';
            state.step = 'profissao';
        }

        async function askIncome() {
            await botSay('Qual é a sua renda mensal aproximada?');
            showQuickReplies([
                { label: 'Até R$ 2.000', action: () => { state.renda = 'Até R$ 2.000'; askCompany(); } },
                { label: 'R$ 2.001 a R$ 5.000', action: () => { state.renda = 'R$ 2.001 a R$ 5.000'; askCompany(); } },
                { label: 'R$ 5.001 a R$ 10.000', action: () => { state.renda = 'R$ 5.001 a R$ 10.000'; askCompany(); } },
                { label: 'Acima de R$ 10.000', action: () => { state.renda = 'Acima de R$ 10.000'; askCompany(); } }
            ]);
        }

        async function askCompany() {
            await botSay('Você trabalha em alguma empresa? Se sim, digite o nome. (Se não, digite "Não")');
            enableInput('text');
            state.step = 'empresa';
        }

        // ============================================================
        // 5. UPLOAD DE DOCUMENTO COM BLUR
        // ============================================================
        async function askDocumentPhoto() {
            await botSay('Para segurança, precisamos que você envie uma foto do seu documento de identificação.');
            
            // Cria o widget de upload no chat
            const container = document.createElement('div');
            container.className = 'quick-replies';
            container.id = 'uploadWidgetContainer';
            
            const uploadArea = document.createElement('div');
            uploadArea.className = 'upload-widget';
            uploadArea.innerHTML = `
                <div style="font-size: 24px; margin-bottom: 8px;">📸</div>
                <div style="font-weight: 600; margin-bottom: 4px;">Tirar foto ou enviar arquivo</div>
                <div style="font-size: 12px; color: var(--text-muted);">Frente do documento</div>
            `;
            
            const previewBox = document.createElement('div');
            previewBox.className = 'doc-preview-box';
            previewBox.id = 'docPreviewBox';
            previewBox.innerHTML = `
                <img src="https://via.placeholder.com/600x400/333333/ffffff?text=DOCUMENTO" class="img-blur" id="blurredImg">
                <div class="doc-actions">
                    <button class="btn-edit" onclick="editDoc()">Editar</button>
                    <button class="btn-confirm" onclick="confirmDoc()">Confirmar</button>
                </div>
            `;
            
            uploadArea.onclick = () => {
                uploadArea.style.display = 'none';
                previewBox.classList.add('active');
                scrollToBottom();
            };
            
            container.appendChild(uploadArea);
            container.appendChild(previewBox);
            chatContainer.insertBefore(container, typingIndicator);
            scrollToBottom();
        }

        // Funções globais para os botões do widget de upload
        window.editDoc = () => {
            document.querySelector('.upload-widget').style.display = 'block';
            document.getElementById('docPreviewBox').classList.remove('active');
        };

        window.confirmDoc = () => {
            document.getElementById('blurredImg').style.filter = 'blur(0px)'; // Remove o blur temporariamente
            setTimeout(() => {
                document.getElementById('blurredImg').style.filter = 'blur(20px)'; // Aplica blur forte
                document.getElementById('uploadWidgetContainer').remove(); // Remove do chat
                state.docFotoConfirmada = true;
                userSay('Documento enviado e confirmado.');
                botSay('Documento validado com sucesso! ✅', 400).then(() => {
                    askCep();
                });
            }, 800);
        };

        // ============================================================
        // 6. ENDEREÇO, SENHA E FINALIZAÇÃO
        // ============================================================
        async function askCep() {
            await botSay('Agora precisamos do seu endereço. Digite o seu CEP (somente números):');
            enableInput('cep');
            state.step = 'cep';
        }

        async function handleCep(cep) {
            await botSay('Buscando endereço...');
            const address = await fetchAddress(cep);
            
            if (!address) {
                await botSay('CEP não encontrado. Por favor, digite novamente:');
                return;
            }

            state.cep = cep;
            state.rua = address.logradouro;
            state.bairro = address.bairro;
            state.cidade = address.localidade;
            state.uf = address.uf;

            await botSay(`Endereço encontrado: <strong>${address.logradouro}</strong>, ${address.bairro}, ${address.localidade} - ${address.uf}.`);
            await botSay('Agora, digite apenas o <strong>número</strong> da sua residência:');
            enableInput('text');
            chatInput.placeholder = 'Ex: 123';
            state.step = 'numero';
        }

        async function askComplement() {
            await botSay('Deseja adicionar um complemento? (Apto, bloco, etc.) Se não, digite "Não".');
            enableInput('text');
            state.step = 'complemento';
        }

        async function askPassword() {
            await botSay('Para finalizar, crie uma senha de acesso para sua conta (mínimo 8 caracteres):');
            enableInput('password');
            state.step = 'senha';
        }

        async function askPin() {
            await botSay('Agora, crie um PIN de segurança de 4 dígitos:');
            enableInput('pin');
            state.step = 'pin';
        }

        async function askTerms() {
            await botSay('Você aceita os Termos de Abertura de Conta e a Política de Privacidade?');
            showQuickReplies([
                { label: 'Sim, aceito os termos', action: () => { finishFlow(); } },
                { label: 'Não aceito', action: () => { botSay('Para abrir a conta é necessário aceitar os termos. A operação foi cancelada.'); disableInput(); } }
            ]);
        }

        async function finishFlow() {
            await botSay('Tudo certo com seus dados! Estou enviando para nossa análise final de crédito e segurança...');
            disableInput();
            
            // Simula análise final
            await botSay('Verificando dados cadastrais...', 1000);
            await botSay('Executando análise antifraude...', 1000);
            await botSay('Aprovando cadastro...', 1000);
            
            // Mostra a tela de sucesso
            document.getElementById('chatContainer').style.display = 'none';
            document.getElementById('inputArea').style.display = 'none';
            
            const nomeExibicao = state.nomeCorrigido || state.nomeReal;
            document.getElementById('resNome').textContent = nomeExibicao;
            document.getElementById('resConta').textContent = `${Math.floor(Math.random() * 90000) + 10000}-${Math.floor(Math.random() * 9)}`;
            document.getElementById('resTipo').textContent = state.tipoConta;
            document.getElementById('resData').textContent = new Date().toLocaleDateString('pt-BR');
            
            document.getElementById('successScreen').classList.add('active');
        }

        // ============================================================
        // 7. PROCESSAMENTO DO INPUT DO USUÁRIO (STATE MACHINE)
        // ============================================================
        function processInput() {
            const value = chatInput.value.trim();
            if (!value) return;

            userSay(value);
            chatInput.value = '';
            disableInput();

            switch (state.step) {
                case 'doc':
                    handleDocument(value);
                    break;
                case 'nome_correcao':
                    state.nomeCorrigido = value;
                    askBirthDate();
                    break;
                case 'data_nasc':
                    state.dataNasc = value;
                    askMotherName();
                    break;
                case 'nome_mae':
                    state.nomeMae = value;
                    askEmail();
                    break;
                case 'email':
                    state.email = value;
                    askPhone();
                    break;
                case 'telefone':
                    state.telefone = value;
                    askProfession();
                    break;
                case 'profissao':
                    state.profissao = value;
                    chatInput.removeAttribute('list'); // Remove o datalist
                    askIncome();
                    break;
                case 'empresa':
                    state.empresa = value;
                    askDocumentPhoto();
                    break;
                case 'cep':
                    handleCep(value);
                    break;
                case 'numero':
                    state.numero = value;
                    askComplement();
                    break;
                case 'complemento':
                    state.complemento = value;
                    askPassword();
                    break;
                case 'senha':
                    if (value.length < 8) {
                        botSay('A senha deve ter no mínimo 8 caracteres. Digite novamente:');
                        enableInput('password');
                        return;
                    }
                    state.senha = value;
                    askPin();
                    break;
                case 'pin':
                    if (value.length !== 4) {
                        botSay('O PIN deve ter exatamente 4 dígitos. Digite novamente:');
                        enableInput('pin');
                        return;
                    }
                    state.pin = value;
                    askTerms();
                    break;
            }
        }

        sendBtn.addEventListener('click', processInput);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') processInput();
        });

        // ============================================================
        // 8. INICIALIZAÇÃO
        // ============================================================
        window.onload = () => {
            disableInput();
            startChat();
        };
    </script>
</body>
</html>
