<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>C6 Bank - Abertura de Conta</title>
    <style>
        /* ===== RESET E ESTILOS GLOBAIS ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* ===== BARRA DE STATUS (simulação mobile) ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            background-color: #0b0b0b;
            color: #fff;
            flex-shrink: 0;
        }
        .status-bar .left { display: flex; align-items: center; gap: 8px; }
        .status-bar .right { display: flex; align-items: center; gap: 8px; }
        .status-bar .battery {
            display: flex; align-items: center; gap: 4px;
        }
        .battery-icon {
            width: 22px; height: 11px; border: 1px solid #fff; border-radius: 3px; position: relative; padding: 1px;
        }
        .battery-icon::after {
            content: ''; position: absolute; right: -3px; top: 3px; width: 2px; height: 5px; background: #fff; border-radius: 0 2px 2px 0;
        }
        .battery-level {
            height: 100%; width: 85%; background: #34c759; border-radius: 1px;
        }

        /* ===== CABEÇALHO COM BOTÃO FECHAR ===== */
        .header {
            display: flex;
            align-items: center;
            padding: 8px 20px;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }
        .close-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: #fff;
            font-size: 22px;
            transition: background 0.2s;
        }
        .close-btn:hover { background: rgba(255,255,255,0.2); }
        .header .title {
            flex: 1;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-right: 44px; /* compensa o botão fechar */
        }

        /* ===== ÁREA PRINCIPAL (CHAT / CONTEÚDO) ===== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 20px;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .main-content::-webkit-scrollbar { display: none; }

        /* ===== MENSAGENS DO CHAT ===== */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 20px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            margin-bottom: 8px;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }
        .message.bot {
            background-color: #1c1c1e;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message.user {
            background-color: #ffffff;
            color: #000000;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }
        .message .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }
        .message .options button {
            background: #2c2c2e;
            border: none;
            color: #fff;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s;
        }
        .message .options button:hover {
            background: #3a3a3c;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== BOTÃO AMARELO PRINCIPAL ===== */
        .btn-yellow {
            background-color: #f2c94c;
            color: #000;
            border: none;
            border-radius: 30px;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            text-align: center;
            flex-shrink: 0;
        }
        .btn-yellow:active { transform: scale(0.97); }
        .btn-yellow:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== FORMULÁRIO DE CADASTRO ===== */
        .form-section {
            display: none;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 20px;
            animation: fadeIn 0.4s ease;
        }
        .form-section.active { display: flex; }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-group label {
            font-size: 13px;
            color: #8e8e93;
            font-weight: 500;
            margin-left: 4px;
        }
        .input-group input {
            background: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            color: #fff;
            outline: none;
            transition: border 0.2s;
        }
        .input-group input:focus {
            border-color: #f2c94c;
        }
        .input-group input::placeholder {
            color: #636366;
        }
        .input-group input:disabled {
            opacity: 0.6;
        }

        .row {
            display: flex;
            gap: 12px;
        }
        .row .input-group { flex: 1; }

        /* ===== TELA DE SUCESSO ===== */
        .success-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            animation: fadeIn 0.5s ease;
        }
        .success-screen.active { display: flex; }
        .success-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        .success-screen h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .success-screen p {
            color: #8e8e93;
            font-size: 15px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* ===== LOADING ===== */
        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px;
            color: #8e8e93;
            font-size: 14px;
        }
        .loading.active { display: flex; }
        .spinner {
            width: 20px; height: 20px;
            border: 2px solid #3a3a3c;
            border-top-color: #f2c94c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== UTILITÁRIOS ===== */
        .hidden { display: none !important; }
        .mt-2 { margin-top: 8px; }
        .text-small { font-size: 13px; color: #8e8e93; }
    </style>
</head>
<body>

    <!-- BARRA DE STATUS -->
    <div class="status-bar">
        <div class="left">
            <span>19:33</span>
            <span>📍</span>
        </div>
        <div class="right">
            <span>📶</span>
            <span>📶</span>
            <div class="battery">
                <span>42%</span>
                <div class="battery-icon"><div class="battery-level"></div></div>
            </div>
        </div>
    </div>

    <!-- CABEÇALHO -->
    <div class="header">
        <button class="close-btn" id="closeBtn" aria-label="Fechar">✕</button>
        <div class="title">Abertura de Conta</div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="main-content" id="mainContent">

        <!-- TELA DE CHAT (Inicial) -->
        <div class="chat-container" id="chatContainer">
            <!-- As mensagens serão injetadas via JS -->
        </div>

        <!-- TELA DE FORMULÁRIO (oculta inicialmente) -->
        <div class="form-section" id="formSection">
            <div class="input-group">
                <label for="cpfInput">CPF</label>
                <input type="tel" id="cpfInput" placeholder="000.000.000-00" maxlength="14" inputmode="numeric">
                <span class="text-small" id="cpfFeedback" style="color:#ff453a; display:none;">CPF inválido</span>
            </div>
            <div class="input-group">
                <label for="nomeInput">Nome Completo</label>
                <input type="text" id="nomeInput" placeholder="Seu nome completo" disabled>
            </div>
            <div class="row">
                <div class="input-group">
                    <label for="dataNascInput">Data de Nascimento</label>
                    <input type="date" id="dataNascInput">
                </div>
                <div class="input-group">
                    <label for="telefoneInput">Telefone</label>
                    <input type="tel" id="telefoneInput" placeholder="(11) 99999-9999" maxlength="15">
                </div>
            </div>
            <div class="input-group">
                <label for="emailInput">E-mail</label>
                <input type="email" id="emailInput" placeholder="seu@email.com">
            </div>
            <div class="input-group">
                <label for="cepInput">CEP</label>
                <input type="tel" id="cepInput" placeholder="00000-000" maxlength="9" inputmode="numeric">
                <span class="text-small" id="cepFeedback"></span>
            </div>
            <div class="row">
                <div class="input-group" style="flex: 2;">
                    <label for="ruaInput">Rua</label>
                    <input type="text" id="ruaInput" placeholder="Rua" disabled>
                </div>
                <div class="input-group" style="flex: 1;">
                    <label for="numeroInput">Número</label>
                    <input type="text" id="numeroInput" placeholder="Nº">
                </div>
            </div>
            <div class="row">
                <div class="input-group">
                    <label for="bairroInput">Bairro</label>
                    <input type="text" id="bairroInput" placeholder="Bairro" disabled>
                </div>
                <div class="input-group">
                    <label for="cidadeInput">Cidade</label>
                    <input type="text" id="cidadeInput" placeholder="Cidade" disabled>
                </div>
                <div class="input-group" style="flex: 0.5;">
                    <label for="ufInput">UF</label>
                    <input type="text" id="ufInput" placeholder="UF" disabled maxlength="2">
                </div>
            </div>
            <div class="loading" id="loadingKyc">
                <div class="spinner"></div>
                <span>Validando dados e realizando análise de crédito...</span>
            </div>
            <button class="btn-yellow" id="btnFinalizar" style="margin-top: 8px;">Finalizar Cadastro</button>
        </div>

        <!-- TELA DE SUCESSO -->
        <div class="success-screen" id="successScreen">
            <div class="success-icon">🎉</div>
            <h2>Conta criada com sucesso!</h2>
            <p>Bem-vindo ao C6 Bank. Sua conta digital está pronta para uso. Você receberá um e-mail com os próximos passos.</p>
            <button class="btn-yellow" onclick="location.reload()">Voltar ao início</button>
        </div>

    </div>

    <!-- BOTÃO AMARELO FIXO (para a tela de chat) -->
    <div style="padding: 16px 20px 24px; flex-shrink: 0;" id="bottomActionArea">
        <button class="btn-yellow" id="btnMainAction">Selecionar</button>
    </div>

    <script>
        // ============================================================
        // 1. CONFIGURAÇÃO E ESTADO
        // ============================================================
        const state = {
            tipoConta: null, // 'PF' ou 'PJ'
            cpf: '',
            nome: '',
            dataNasc: '',
            telefone: '',
            email: '',
            cep: '',
            rua: '',
            numero: '',
            bairro: '',
            cidade: '',
            uf: ''
        };

        // Elementos do DOM
        const chatContainer = document.getElementById('chatContainer');
        const formSection = document.getElementById('formSection');
        const successScreen = document.getElementById('successScreen');
        const bottomActionArea = document.getElementById('bottomActionArea');
        const btnMainAction = document.getElementById('btnMainAction');
        const loadingKyc = document.getElementById('loadingKyc');
        const btnFinalizar = document.getElementById('btnFinalizar');

        // Inputs
        const cpfInput = document.getElementById('cpfInput');
        const nomeInput = document.getElementById('nomeInput');
        const dataNascInput = document.getElementById('dataNascInput');
        const telefoneInput = document.getElementById('telefoneInput');
        const emailInput = document.getElementById('emailInput');
        const cepInput = document.getElementById('cepInput');
        const ruaInput = document.getElementById('ruaInput');
        const numeroInput = document.getElementById('numeroInput');
        const bairroInput = document.getElementById('bairroInput');
        const cidadeInput = document.getElementById('cidadeInput');
        const ufInput = document.getElementById('ufInput');
        const cpfFeedback = document.getElementById('cpfFeedback');
        const cepFeedback = document.getElementById('cepFeedback');

        // ============================================================
        // 2. FUNÇÕES UTILITÁRIAS
        // ============================================================

        /** Adiciona uma mensagem ao chat */
        function addMessage(text, sender = 'bot', options = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerHTML = `<span>${text}</span>`;

            if (options) {
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';
                options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.textContent = opt.label;
                    btn.onclick = () => {
                        // Remove as opções após clicar
                        msgDiv.querySelector('.options')?.remove();
                        addMessage(opt.label, 'user');
                        if (opt.action) opt.action();
                    };
                    optionsDiv.appendChild(btn);
                });
                msgDiv.appendChild(optionsDiv);
            }

            chatContainer.appendChild(msgDiv);
            // Scroll para o final
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        /** Exibe a tela de formulário e esconde o chat */
        function showForm() {
            chatContainer.style.display = 'none';
            formSection.classList.add('active');
            bottomActionArea.style.display = 'none';
        }

        /** Exibe a tela de sucesso */
        function showSuccess() {
            formSection.classList.remove('active');
            successScreen.classList.add('active');
            bottomActionArea.style.display = 'none';
        }

        // ============================================================
        // 3. LÓGICA DO CHAT (FLUXO INICIAL)
        // ============================================================

        // Mensagens iniciais após um pequeno delay
        setTimeout(() => {
            addMessage('Olá! 😊');
            setTimeout(() => {
                addMessage('Que bom ver você aqui!');
                setTimeout(() => {
                    addMessage('A abertura da sua conta é rápida, segura e leva poucos minutos.');
                    setTimeout(() => {
                        addMessage('Primeiro, qual tipo de conta você quer abrir?', 'bot', [
                            { label: 'Abrir uma conta pessoal (PF)', action: () => { state.tipoConta = 'PF'; proceedAfterType(); } },
                            { label: 'Abrir uma conta empresarial (PJ)', action: () => { state.tipoConta = 'PJ'; proceedAfterType(); } }
                        ]);
                    }, 300);
                }, 300);
            }, 300);
        }, 500);

        // Após escolher o tipo de conta
        function proceedAfterType() {
            setTimeout(() => {
                addMessage('As contas do C6 Bank são para clientes acima de 18 anos e ficam vinculadas ao CPF, tanto a conta pessoal quanto a empresarial.');
                setTimeout(() => {
                    addMessage('Por isso, digite o número do seu CPF.');
                    // Mostra o botão amarelo para "Selecionar" (que leva ao formulário)
                    btnMainAction.textContent = 'Selecionar';
                    btnMainAction.onclick = () => {
                        showForm();
                        // Pré-preenche o CPF se já tiver sido digitado (não é o caso aqui)
                    };
                }, 400);
            }, 400);
        }

        // ============================================================
        // 4. MÁSCARAS E VALIDAÇÕES
        // ============================================================

        // Máscara de CPF
        cpfInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            e.target.value = value;
            state.cpf = value;
            // Validação em tempo real
            if (value.length === 14) {
                if (isValidCPF(value)) {
                    cpfFeedback.style.display = 'none';
                    // Simula busca de nome (API paga simulada)
                    simulateNameFetch();
                } else {
                    cpfFeedback.textContent = 'CPF inválido. Verifique os dígitos.';
                    cpfFeedback.style.display = 'block';
                }
            } else {
                cpfFeedback.style.display = 'none';
            }
        });

        // Máscara de Telefone
        telefoneInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            if (value.length > 10) {
                value = value.replace(/^(\d{2})(\d{5})(\d{4}).*/, '($1) $2-$3');
            } else if (value.length > 6) {
                value = value.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, '($1) $2-$3');
            } else if (value.length > 2) {
                value = value.replace(/^(\d{2})(\d{0,5})/, '($1) $2');
            } else {
                value = value.replace(/^(\d*)/, '($1');
            }
            e.target.value = value;
            state.telefone = value;
        });

        // Máscara de CEP
        cepInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 8) value = value.slice(0, 8);
            value = value.replace(/^(\d{5})(\d)/, '$1-$2');
            e.target.value = value;
            state.cep = value;
        });

        // Busca de CEP via ViaCEP (API gratuita)
        cepInput.addEventListener('blur', async () => {
            const cep = cepInput.value.replace(/\D/g, '');
            if (cep.length === 8) {
                cepFeedback.textContent = 'Buscando endereço...';
                cepFeedback.style.color = '#8e8e93';
                try {
                    const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                    const data = await response.json();
                    if (data.erro) {
                        cepFeedback.textContent = 'CEP não encontrado.';
                        cepFeedback.style.color = '#ff453a';
                        clearAddressFields();
                    } else {
                        cepFeedback.textContent = '';
                        ruaInput.value = data.logradouro || '';
                        bairroInput.value = data.bairro || '';
                        cidadeInput.value = data.localidade || '';
                        ufInput.value = data.uf || '';
                        state.rua = data.logradouro || '';
                        state.bairro = data.bairro || '';
                        state.cidade = data.localidade || '';
                        state.uf = data.uf || '';
                    }
                } catch (error) {
                    cepFeedback.textContent = 'Erro ao buscar CEP. Tente novamente.';
                    cepFeedback.style.color = '#ff453a';
                }
            } else if (cepInput.value.length > 0) {
                cepFeedback.textContent = 'CEP inválido.';
                cepFeedback.style.color = '#ff453a';
                clearAddressFields();
            }
        });

        function clearAddressFields() {
            ruaInput.value = '';
            bairroInput.value = '';
            cidadeInput.value = '';
            ufInput.value = '';
            state.rua = '';
            state.bairro = '';
            state.cidade = '';
            state.uf = '';
        }

        /** Validação de CPF (algoritmo local, sem API) */
        function isValidCPF(cpf) {
            cpf = cpf.replace(/[^\d]+/g, '');
            if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
            let sum = 0, rest;
            for (let i = 1; i <= 9; i++) sum += parseInt(cpf.substring(i - 1, i)) * (11 - i);
            rest = (sum * 10) % 11;
            if ((rest === 10) || (rest === 11)) rest = 0;
            if (rest !== parseInt(cpf.substring(9, 10))) return false;
            sum = 0;
            for (let i = 1; i <= 10; i++) sum += parseInt(cpf.substring(i - 1, i)) * (12 - i);
            rest = (sum * 10) % 11;
            if ((rest === 10) || (rest === 11)) rest = 0;
            if (rest !== parseInt(cpf.substring(10, 11))) return false;
            return true;
        }

        /** Simula busca de nome em API paga (ex: Serpro) */
        function simulateNameFetch() {
            // Simula um delay de 1 segundo
            setTimeout(() => {
                // Gera um nome fictício baseado no CPF (para demonstração)
                const nomes = ['João Silva', 'Maria Santos', 'Carlos Oliveira', 'Ana Souza', 'Pedro Costa'];
                const randomName = nomes[Math.floor(Math.random() * nomes.length)];
                nomeInput.value = randomName;
                nomeInput.disabled = false;
                state.nome = randomName;
            }, 800);
        }

        // ============================================================
        // 5. FINALIZAÇÃO DO CADASTRO (SIMULAÇÃO DE KYC)
        // ============================================================

        btnFinalizar.addEventListener('click', () => {
            // Validação básica dos campos obrigatórios
            const requiredFields = [
                { field: cpfInput, message: 'CPF é obrigatório' },
                { field: nomeInput, message: 'Nome é obrigatório' },
                { field: dataNascInput, message: 'Data de nascimento é obrigatória' },
                { field: telefoneInput, message: 'Telefone é obrigatório' },
                { field: emailInput, message: 'E-mail é obrigatório' },
                { field: cepInput, message: 'CEP é obrigatório' },
                { field: numeroInput, message: 'Número é obrigatório' }
            ];

            for (let rf of requiredFields) {
                if (!rf.field.value.trim()) {
                    alert(rf.message);
                    rf.field.focus();
                    return;
                }
            }

            // Atualiza estado
            state.cpf = cpfInput.value;
            state.nome = nomeInput.value;
            state.dataNasc = dataNascInput.value;
            state.telefone = telefoneInput.value;
            state.email = emailInput.value;
            state.cep = cepInput.value;
            state.numero = numeroInput.value;
            state.rua = ruaInput.value;
            state.bairro = bairroInput.value;
            state.cidade = cidadeInput.value;
            state.uf = ufInput.value;

            // Mostra loading (simula análise de KYC)
            loadingKyc.classList.add('active');
            btnFinalizar.disabled = true;

            // Simula chamada de API de KYC (processamento de 2.5 segundos)
            setTimeout(() => {
                loadingKyc.classList.remove('active');
                btnFinalizar.disabled = false;
                // Exibe tela de sucesso
                showSuccess();
            }, 2500);
        });

        // ============================================================
        // 6. BOTÃO FECHAR (recarrega a página para reiniciar)
        // ============================================================
        document.getElementById('closeBtn').addEventListener('click', () => {
            if (confirm('Deseja realmente sair do processo de abertura de conta?')) {
                location.reload();
            }
        });

        // ============================================================
        // 7. INICIALIZAÇÃO
        // ============================================================
        // Foca no campo CPF quando o formulário for exibido
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.target.id === 'formSection' && mutation.target.classList.contains('active')) {
                    cpfInput.focus();
                }
            });
        });
        observer.observe(formSection, { attributes: true, attributeFilter: ['class'] });

    </script>
</body>
</html>
